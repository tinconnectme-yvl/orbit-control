version: '3.8'

services:
  orbita-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbita-control-app
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
