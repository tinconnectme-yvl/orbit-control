name: Deploy static frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the existing frontend build
        run: |
          mkdir -p pages
          cp -a frontend/dist/. pages/
          find pages -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -exec sed -i 's|/assets/|./assets/|g' {} +
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
